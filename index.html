<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1F3A5E">
    <meta name="description" content="تطبيق السنة النبوية - شامل للأحاديث والشروحات">
    
    <title>تطبيق السنة 📖</title>
    
    <!-- ربط ملف CSS -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- أيقونة التطبيق -->
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%231F3A5E' width='192' height='192'/><text x='96' y='130' font-size='100' fill='white' text-anchor='middle' font-family='Arial'>📖</text></svg>">
</head>
<body>
    <!-- الشريط العلوي -->
    <header class="header">
        <div class="header-content">
            <h1>🕌 تطبيق السنة</h1>
            <button id="darkModeBtn" class="btn-icon">🌙</button>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="main-content">
        <!-- شريط البحث -->
        <div class="search-container">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="ابحث عن حديث..."
                class="search-input"
            >
            <button class="btn-search">🔍</button>
        </div>

        <!-- الفلاتر -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">الكل</button>
            <button class="filter-btn" data-filter="sahih">✓ صحيح</button>
            <button class="filter-btn" data-filter="hasan">≈ حسن</button>
            <button class="filter-btn" data-filter="daif">! ضعيف</button>
        </div>

        <!-- قائمة الأحاديث -->
        <div class="hadith-list" id="hadithList">
            <div class="loading">جاري التحميل...</div>
        </div>
    </main>

    <!-- الصفحات المختلفة (مخفية حالياً) -->
    
    <!-- صفحة تفاصيل الحديث -->
    <div id="hadithDetailPage" class="page hidden">
        <header class="header">
            <button class="btn-back">← رجوع</button>
            <h1>تفاصيل الحديث</h1>
            <button class="btn-favorite">🤍</button>
        </header>
        <div class="detail-content" id="detailContent">
            <!-- سيملأ بـ JavaScript -->
        </div>
    </div>

    <!-- صفحة المفضلة -->
    <div id="favoritesPage" class="page hidden">
        <header class="header">
            <h1>❤️ المفضلة</h1>
            <button class="btn-settings">⚙️</button>
        </header>
        <div class="favorites-list" id="favoritesList">
            <div class="empty-state">
                <p>لا توجد مفضلات بعد</p>
                <button class="btn-primary">ابدأ الآن</button>
            </div>
        </div>
    </div>

    <!-- صفحة الإعدادات -->
    <div id="settingsPage" class="page hidden">
        <header class="header">
            <button class="btn-back">← رجوع</button>
            <h1>⚙️ الإعدادات</h1>
        </header>
        <div class="settings-content">
            <!-- حجم الخط -->
            <div class="setting-group">
                <label>حجم الخط:</label>
                <div class="font-size-control">
                    <button class="btn-small">-</button>
                    <span id="fontSizeValue">عادي</span>
                    <button class="btn-large">+</button>
                </div>
            </div>

            <!-- الوضع الليلي -->
            <div class="setting-group">
                <label>الوضع الليلي:</label>
                <button id="darkModeToggle" class="toggle-btn">OFF</button>
            </div>

            <!-- حول التطبيق -->
            <div class="setting-group">
                <button class="btn-text">📖 عن التطبيق</button>
                <button class="btn-text">📋 الشروط والخصوصية</button>
                <button class="btn-text">💾 تحميل البيانات</button>
            </div>
        </div>
    </div>

    <!-- شريط التنقل السفلي -->
    <nav class="bottom-nav">
        <button class="nav-btn active" data-page="home">
            <span class="icon">🏠</span>
            <span>الرئيسية</span>
        </button>
        <button class="nav-btn" data-page="favorites">
            <span class="icon">❤️</span>
            <span>المفضلة</span>
        </button>
        <button class="nav-btn" data-page="settings">
            <span class="icon">⚙️</span>
            <span>الإعدادات</span>
        </button>
    </nav>

    <!-- ملف JavaScript -->
    <script src="app.js"></script>

    <!-- تسجيل Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(reg => console.log('✓ Service Worker تم تسجيله'))
                .catch(err => console.log('✗ خطأ في Service Worker:', err));
        }
    </script>
</body>
</html>
